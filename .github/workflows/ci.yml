name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Glob, not the single file: requirements-ci.txt is now just `-r requirements.txt`,
          # so keying the cache on it alone would never invalidate when deps actually change.
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara poppler-utils
      - run: pip install -r requirements-ci.txt
      - name: Run API tests on SQLite
        env:
          DJANGO_TEST_SQLITE: '1'
          DJANGO_SECRET_KEY: ci-only
        run: python manage.py test

  api-tests-postgres:
    name: api-tests-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pharmalink
          POSTGRES_PASSWORD: pharmalink
          POSTGRES_DB: pharmalink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmalink -d pharmalink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://pharmalink:pharmalink@127.0.0.1:5432/pharmalink_test
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Glob, not the single file: requirements-ci.txt is now just `-r requirements.txt`,
          # so keying the cache on it alone would never invalidate when deps actually change.
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara poppler-utils
      - run: pip install -r requirements-ci.txt
      - name: Run API tests on PostgreSQL
        run: python manage.py test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    outputs:
      destructive: ${{ steps.safety.outputs.destructive }}
    env:
      DATABASE_URL: sqlite:////tmp/pharmalink-ci-migrations.sqlite3
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_DEBUG: 'false'
      SESSION_COOKIE_SECURE: 'true'
      CSRF_COOKIE_SECURE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Glob, not the single file: requirements-ci.txt is now just `-r requirements.txt`,
          # so keying the cache on it alone would never invalidate when deps actually change.
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -r requirements-ci.txt
      - name: Check migration consistency
        working-directory: apps/api
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django deployment checks
        working-directory: apps/api
        run: python manage.py check --deploy
      - name: Select comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect destructive migration operations
        id: safety
        run: .github/scripts/detect-destructive-migrations.sh "${{ steps.base.outputs.sha }}" "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: migration-safety-${{ github.sha }}
          path: migration-safety.json
          retention-days: 14

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --dir apps/web exec tsc --noEmit
      - name: Lint
        run: pnpm --dir apps/web lint
      - name: Build
        run: pnpm --dir apps/web build

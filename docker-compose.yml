services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medisync
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: medisync
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync -d medisync"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmalink
      POSTGRES_USER: pharmalink
      POSTGRES_PASSWORD: pharmalink
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmalink -d pharmalink"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

